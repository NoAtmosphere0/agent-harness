[project]
name = "agent-harness"
version = "0.1.0"
description = "Hand-written LLM agent harness for an operations assistant (take-home assessment)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Dang Hoang Long" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "structlog>=24.1",
    "openai>=1.40",
    "rank-bm25>=0.2.2",
]

[project.scripts]
harness = "harness.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "weasyprint>=62",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Markdown code blocks are spec/excerpts, not source; don't reformat them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "ASYNC",        # blocking calls inside async code
    "DTZ",          # naive datetimes
    "PT",           # pytest style
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["harness"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src/harness", "tests"]
mypy_path = "src"
strict = true                       # includes disallow_untyped_defs
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["rank_bm25.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
    "live: calls a real LLM; skipped unless LLM_API_KEY is set",
]

[tool.coverage.run]
branch = true
source = ["harness"]
omit = ["*/harness/llm/openai_compat.py", "*/harness/cli.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
